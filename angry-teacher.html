  engine.gravity.y = 1;

  const ground = Bodies.rectangle(W / 2, GROUND + 60, 5000, 120, { isStatic: true, friction: 0.9, restitution: 0.1, plugin: { kind: 'ground' } });
  Composite.add(world, ground);
  L = {
    idx, def, engine, world, blocks: [], studs: [], projs: [], queue: def.ammo.split('').map((k) => AM[k]), ammoTotal: def.ammo.length,
    score: 0, phase: 'ready', events: [], restore: [], parts: [], pops: [], aim: false, P: { x: SLING.x, y: SLING.y }, shake: 0,
    shots: 0, winT: 0, endT: 0, banner: 2.2, warm: true, paused: false, settleT: 0, calm: 0, total: 0, stars: 0, bonus: 0, smartCount: 0, flingT: 0
  };
  const bd = mkBuilder(); def.build(bd);
  const hpS = def.hp;

    const body = Bodies.rectangle(s.x, GROUND - s.yb - s.h / 2 - 0.4, s.w, s.h, { density: m.d, friction: m.f, frictionStatic: 1, restitution: m.r, frictionAir: 0.004, sleepThreshold: 40, plugin: {} });

    body.plugin = { kind: 'block', ref: bk }; Composite.add(world, body); L.blocks.push(bk);
  }
  let si = 0;
  for (const s of bd.out.studs) {
    const r = SR[s.type], spec = STU[s.type];
    const hp = s.type === 'boss' && def.bossHp ? def.bossHp : spec.hp;
    const body = Bodies.circle(s.x, GROUND - s.yb - r - 0.4, r, { density: 0.0012, friction: 0.7, frictionStatic: 1, restitution: 0.1, frictionAir: 0.004, sleepThreshold: 40, plugin: {} });
    const st = { type: s.type, body, r, hp, max: hp, smart: false, cool: 0, dodge: 0, flash: 0, look: LOOKS[si % LOOKS.length], phase: si * 1.7, pts: spec.pts, dodgeN: 0 };

      const ma = a.isStatic ? Infinity : a.mass, mb = b.isStatic ? Infinity : b.mass;
      const eff = isFinite(ma) && isFinite(mb) ? ma * mb / (ma + mb) : Math.min(ma, mb);
      L.events.push({ a, b, rel, impact: rel * eff, va: { x: va.x, y: va.y }, vb: { x: vb.x, y: vb.y } });
    }
  });
  for (let i = 0; i < 120 * SUB; i++) Engine.update(engine, 1000 / 60 / SUB);
  L.warm = false; L.events.length = 0;

  const S = L.studs.reduce((a, s) => a + s.pts, 0), A = L.ammoTotal;
  L.star2 = S + 500 + 1000 * Math.floor(A / 3);

  scene = 'play'; bubble = null;
}

  if (save.best[L.idx] === L.total) txt(c, 'NEW BEST!', 600, 412, 22, '#e03131', 'center', null);
  button(c, 380, 440, 130, 60, 'RETRY', () => { SFX.click(); startLevel(L.idx); }, { color: '#ffa94d', size: 26 });
  button(c, 530, 440, 130, 60, 'LEVELS', () => { SFX.click(); scene = 'levels'; }, { color: '#74c0fc', size: 26 });
  if (L.idx < LEVELS.length - 1) button(c, 680, 440, 150, 60, 'NEXT', () => { SFX.click(); startLevel(L.idx + 1); }, { color: '#51cf66', size: 28 });
}
function renderLose(c) {
  dim(c); panel(c, 340, 110, 520, 380);
  txt(c, 'DETENTION!', 600, 165, 52, '#e03131', 'center', '#5a1a1a');
  const left = L.studs.filter((s) => !s.smart).length;
  txt(c, `${left} student${left === 1 ? '' : 's'} still clueless...`, 600, 230, 26, '#5a3410', 'center', null);
  txt(c, `Score: ${L.score}`, 600, 272, 24, '#5a3410', 'center', null);
  for (let i = 0; i < 3; i++) star(c, 600 + (i - 1) * 90, 335, 34, '#d9cdb0', '#a89a78');
  button(c, 390, 392, 200, 66, 'TRY AGAIN', () => { SFX.click(); startLevel(L.idx); }, { color: '#ffa94d', size: 26 });
  button(c, 610, 392, 200, 66, 'LEVELS', () => { SFX.click(); scene = 'levels'; }, { color: '#74c0fc', size: 26 });
}

function renderTitle(c) {
  c.drawImage(bgImg, 0, 0); btns.length = 0;
  c.fillStyle = 'rgba(20,10,0,.25)'; c.fillRect(0, 0, W, H);
  drawTeacher(c, { x: TX + 60 + Math.sin(T * 6) * 3, y: 400 }, true, 170, GROUND, 1.25);
  const dummy = { type: 'slacker', body: { position: { x: 1000, y: 490 }, angle: 0 }, r: 30, look: LOOKS[0], smart: false, phase: 0, hp: 1, max: 1, flash: 0 };
  dummy.r = 30; drawStudent(c, dummy);
  const d2 = { type: 'clown', body: { position: { x: 930, y: 494 }, angle: 0 }, r: 26, look: LOOKS[2], smart: true, phase: 2, hp: 2, max: 2, flash: 0 }; drawStudent(c, d2);
  const d3 = { type: 'zombie', body: { position: { x: 1070, y: 494 }, angle: 0 }, r: 26, look: LOOKS[3], smart: false, phase: 1, hp: 1, max: 1, flash: 0 }; drawStudent(c, d3);
  drawProj(c, 'textbook', 560, 470 + Math.sin(T * 3) * 4, Math.sin(T * 2) * 0.3, 1.5); drawProj(c, 'pencil', 650, 480, 0.3, 1.3); drawProj(c, 'eraser', 710, 478 + Math.sin(T * 3 + 1) * 4, 0, 1.4);
  drawProj(c, 'dictionary', 480, 490, -0.1, 1.2); drawProj(c, 'chalk', 770, 492, 0.2, 1.3);
  c.save(); c.translate(600, 280); c.rotate(Math.sin(T * 1.5) * 0.02);
  txt(c, 'ANGRY', 0, -190, 104, '#ff5a3c', 'center', '#3a1408'); txt(c, 'TEACHER', 0, -96, 104, '#ffd43b', 'center', '#3a1408'); c.restore();
  txt(c, 'Turn the clueless class SMART... with flying homework!', 600, 268, 26, '#fff');
  button(c, 470, 310, 260, 80, 'PLAY', () => { SFX.click(); scene = 'levels'; }, { color: '#51cf66', size: 48 });
  button(c, 1020, 14, 160, 46, muted ? 'SOUND OFF' : 'SOUND ON', toggleMute, { color: '#b197fc', size: 20 });
  txt(c, 'Drag the slingshot back, release to launch. Tap mid-flight for special powers!', 600, 560, 20, '#fff');
}
function renderLevels(c) {
  c.drawImage(bgImg, 0, 0); btns.length = 0; c.fillStyle = 'rgba(20,10,0,.45)'; c.fillRect(0, 0, W, H);
  txt(c, 'PICK A LESSON', 600, 80, 62, '#ffd43b', 'center', '#3a1408');
  for (let i = 0; i < 10; i++) {
    const col = i % 5, row = Math.floor(i / 5), x = 119 + col * 198, y = 150 + row * 200, unlocked = i === 0 || save.stars[i - 1] > 0;
    button(c, x, y, 170, 170, '', () => { if (unlocked) { SFX.click(); startLevel(i); } else SFX.ouch(); }, {
      color: unlocked ? '#ffcc33' : '#adb5bd',
      draw: (cc, cx, cy) => {
        if (unlocked) {
          txt(cc, String(i + 1), cx, cy - 34, 62, '#fff', 'center', '#5a3410');
          txt(cc, LEVELS[i].name, cx, cy + 14, 17, '#5a3410', 'center', null);
          for (let s = 0; s < 3; s++) star(cc, cx + (s - 1) * 38, cy + 52, 15, s < save.stars[i] ? '#ffd43b' : '#e6d9b8', s < save.stars[i] ? '#8a6d00' : '#b5a57a');
        } else {
          cc.fillStyle = '#495057'; rr(cc, cx - 22, cy - 12, 44, 38, 6); cc.fill(); cc.strokeStyle = '#495057'; cc.lineWidth = 7; cc.beginPath(); cc.arc(cx, cy - 12, 14, Math.PI, 0); cc.stroke();
          txt(cc, String(i + 1), cx, cy + 52, 26, '#dee2e6', 'center', '#495057');
        }
      }
    });
  }
  button(c, 30, 520, 150, 56, 'BACK', () => { SFX.click(); scene = 'title'; }, { color: '#ff8787', size: 28 });
}

/* ================================== INPUT ================================== */
function toLogical(e) { const r = canvas.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
function onDown(e) {
  ensureAudio(); const p = toLogical(e); mouse = p;
  for (let i = btns.length - 1; i >= 0; i--) { const b = btns[i]; if (inside(p, b.x, b.y, b.w, b.h)) { b.cb(); e.preventDefault(); return; } }
  if (scene !== 'play' || !L || L.paused || L.winT) return;
  if (L.phase === 'ready' && L.queue.length) { L.phase = 'aiming'; L.aim = true; updatePouch(p); try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ok */ } }
  else if (L.phase === 'flying') activate();
}
function onMove(e) { const p = toLogical(e); mouse = p; if (scene === 'play' && L && L.phase === 'aiming') updatePouch(p); }
function onUp() {
  if (scene !== 'play' || !L || L.phase !== 'aiming') return;
  const v = pullVel();
  if (v.len < 24) { L.phase = 'ready'; L.aim = false; L.P = { x: SLING.x, y: SLING.y }; return; }
  fire(v.x, v.y, L.P.x, L.P.y);
}
function onKey(e) {
  if (e.key === ' ' && scene === 'play' && L && L.phase === 'flying') { activate(); e.preventDefault(); }
  else if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && scene === 'play' && L && L.phase !== 'win' && L.phase !== 'lose') L.paused = !L.paused;
  else if (e.key === 'm' || e.key === 'M') toggleMute();
  else if ((e.key === 'r' || e.key === 'R') && scene === 'play' && L) startLevel(L.idx);
}

/* =================================== LOOP =================================== */
let last = 0, acc = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts; T += dt;
  btns = [];
  g.setTransform(ctxScale, 0, 0, ctxScale, 0, 0);
  if (scene === 'play' && L) {
    const live = !L.paused && L.phase !== 'win' && L.phase !== 'lose';
    if (live || L.phase === 'win' || L.phase === 'lose') {
      if (!L.paused) {
        acc += dt; let n = 0;
        while (acc >= 1 / 60 && n++ < 4) { if (L.phase !== 'win' && L.phase !== 'lose') stepFrame(); acc -= 1 / 60; }
        if (n >= 4) acc = 0;
        const k = dt * 60;
        for (const p of L.parts) { p.x += p.vx * k; p.y += p.vy * k; p.vy += p.g * k; p.life -= dt; p.rot += 0.1 * k; }
        L.parts = L.parts.filter((p) => p.life > 0);
        for (const p of L.pops) p.t -= dt; L.pops = L.pops.filter((p) => p.t > 0);
        L.shake = Math.max(0, L.shake - dt); L.banner -= dt; L.flingT = Math.max(0, L.flingT - dt); L.endT += dt;
        for (const s of L.studs) if (s.smart && Math.random() < 0.01) starBurst(s.body.position.x, s.body.position.y - s.r, 1);
        if (L.phase === 'aiming' && Math.random() < 0.3) L.parts.push({ x: TX + rnd(-30, 30), y: GROUND - 200, vx: rnd(-1, 1), vy: -1.5, life: 0.5, max: 0.5, c: '#fff', s: 7, g: 0, rot: 0, type: 'bit' });
        if (bubble) bubble.t -= dt;
      }
    }
    renderPlay(g);
    if (L.phase === 'win') { /* win sounds for stars */ if (Math.floor(L.endT * 2) !== L._sn && L.endT > 0.5) { L._sn = Math.floor(L.endT * 2); if (L.endT < 0.5 + L.stars * 0.5 + 0.3) SFX.star(); } }
  } else if (scene === 'levels') renderLevels(g);
  else renderTitle(g);
  requestAnimationFrame(frame);
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2), cw = window.innerWidth, ch = window.innerHeight;
  scale = Math.min(cw / W, ch / H); const vw = Math.floor(W * scale), vh = Math.floor(H * scale);
  canvas.style.width = vw + 'px'; canvas.style.height = vh + 'px'; canvas.width = Math.round(vw * dpr); canvas.height = Math.round(vh * dpr); ctxScale = vw * dpr / W;
}
function init() {
  canvas = document.getElementById('c'); g = canvas.getContext('2d'); bgImg = makeBG(); resize();
  window.addEventListener('resize', resize); window.addEventListener('orientationchange', resize);
  canvas.addEventListener('pointerdown', onDown); canvas.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp); window.addEventListener('keydown', onKey);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('visibilitychange', () => { if (document.hidden && scene === 'play' && L && L.phase !== 'win' && L.phase !== 'lose') L.paused = true; });
  const rot = document.getElementById('rot'); if (rot) rot.addEventListener('pointerdown', () => { rot.style.display = 'none'; });
  requestAnimationFrame(frame);
}
window.__AT = { runShots(idx, shots) {
    startLevel(idx); const Lv = L;
    for (const sh of shots) {
      if (Lv.phase === 'lose' || Lv.winT) break;
      const type = Lv.queue[0], spec = PROJ[type], dx = Math.cos(sh.ang), dy = -Math.sin(sh.ang), sp = sh.pow * MAXV * spec.spd;
      fire(dx * sp, dy * sp, SLING.x - dx * sh.pow * MAXPULL, SLING.y - dy * sh.pow * MAXPULL);
      let f = 0;
      while (Lv.phase === 'flying' || Lv.phase === 'settle') { stepFrame(); f++; if (sh.tap >= 0 && f === sh.tap && Lv.phase === 'flying') activate(); if (f > 2000 || Lv.winT) break; }
    }
    let f = 0; while (Lv.winT && Lv.phase !== 'win' && f++ < 300) stepFrame();
    return { smart: Lv.studs.filter((s) => s.smart).length, n: Lv.studs.length, score: Lv.score, phase: Lv.phase, left: Lv.queue.length, ammo: Lv.queue.join(',') };
  }, startLevel, get L() { return L; }, stepFrame, fire, activate, LEVELS, PROJ, pullVel, go(s) { scene = s; }, setP(p) { L.P = p; }, updatePouch };
init();
})();
